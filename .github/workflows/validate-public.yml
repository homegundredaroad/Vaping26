name: Validate and deploy Vaping26 Observatory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaping26-public-observatory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install PDF build dependency
        run: python -m pip install reportlab==4.4.3
      - name: Validate disclosure boundary and publication manifest
        run: python scripts/validate_public.py
      - name: Run public-site regression tests
        run: python -m unittest discover -s tests -v
      - name: Build validated static site and results PDF
        run: python scripts/build_site.py
      - name: Assert deployable evidence is inside Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s build/site/index.html
          test -s build/site/results.html
          test -s build/site/downloads/vaping26-current-results.pdf
          test $(stat -c%s build/site/downloads/vaping26-current-results.pdf) -gt 2000
          test -s build/site/assets/site.js
          test -s build/site/data/public/research_status.json
          test -s build/site/evidence/evidence_cards.json
          test -s build/site/evidence/health_evidence_summary.json
          test -s build/site/evidence/ons_prevalence.json
          test -s build/site/evidence/synthesis_register.json
          test -s build/site/evidence/youth_prevalence.json
          test -s build/site/provenance/source_register.json
          test -s build/site/provenance/source_coverage.json
          test -s build/site/provenance/publication_manifest.json
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/site

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: validate-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Vaping26 Observatory to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify live publication parity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ["PAGE_URL"].rstrip("/")+"/"
          checks={
            "data/public/research_status.json":lambda p:bool(p.get("generated_at")),
            "evidence/evidence_cards.json":lambda p:int(p.get("card_count",0))>0 and bool(p.get("records")),
            "evidence/health_evidence_summary.json":lambda p:bool(p.get("literature")),
            "evidence/ons_prevalence.json":lambda p:bool(p.get("latest_year")) and bool(p.get("estimates")),
            "evidence/synthesis_register.json":lambda p:int(p.get("question_count",0))>0 and bool(p.get("questions")),
            "evidence/youth_prevalence.json":lambda p:int(p.get("record_count",0))>0 and bool(p.get("records")),
            "provenance/source_register.json":lambda p:int(p.get("source_count",0))>0,
            "provenance/source_coverage.json":lambda p:isinstance(p,dict) and bool(p),
          }
          failures=[]
          for rel,predicate in checks.items():
            last_error=None
            for attempt in range(8):
              try:
                req=urllib.request.Request(base+rel,headers={"User-Agent":"Vaping26-live-parity-check/1.0"})
                with urllib.request.urlopen(req,timeout=20) as response:
                  if response.status!=200: raise RuntimeError(f"HTTP {response.status}")
                  payload=json.load(response)
                if not predicate(payload): raise RuntimeError("semantic content check failed")
                print(f"PASS {rel}"); break
              except Exception as exc:
                last_error=exc
                if attempt<7: time.sleep(5)
            else: failures.append(f"{rel}: {last_error}")
          pdf_url=base+"downloads/vaping26-current-results.pdf"
          try:
            req=urllib.request.Request(pdf_url,headers={"User-Agent":"Vaping26-live-parity-check/1.0"})
            with urllib.request.urlopen(req,timeout=20) as response:
              data=response.read()
            if not data.startswith(b"%PDF-") or len(data)<2000: raise RuntimeError("invalid or implausibly small PDF")
            print("PASS downloads/vaping26-current-results.pdf")
          except Exception as exc: failures.append(f"downloads/vaping26-current-results.pdf: {exc}")
          if failures: raise SystemExit("LIVE PUBLICATION PARITY FAILED\n - "+"\n - ".join(failures))
          print("LIVE PUBLICATION PARITY PASS")
          PY
