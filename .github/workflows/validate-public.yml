name: Validate and deploy Vaping26 Observatory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaping26-public-observatory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install PDF build dependency
        run: python -m pip install reportlab==4.4.3
      - name: Validate disclosure boundary and publication manifest
        run: python scripts/validate_public.py
      - name: Run public-site regression tests
        run: python -m unittest discover -s tests -v
      - name: Build validated static site and results PDF
        run: python scripts/build_site.py
      - name: Harden reviewer-facing static publication
        run: python scripts/harden_public_build.py
      - name: Assert deployable evidence is inside Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s build/site/index.html
          test -s build/site/results.html
          test -s build/site/sources.html
          test -s build/site/methodology.html
          test -s build/site/downloads/vaping26-current-results.pdf
          test $(stat -c%s build/site/downloads/vaping26-current-results.pdf) -gt 2000
          test -s build/site/assets/site.js
          test -s build/site/data/public/research_status.json
          test -s build/site/evidence/evidence_cards.json
          test -s build/site/evidence/health_evidence_summary.json
          test -s build/site/evidence/ons_prevalence.json
          test -s build/site/evidence/synthesis_register.json
          test -s build/site/evidence/youth_prevalence.json
          test -s build/site/provenance/source_register.json
          test -s build/site/provenance/source_coverage.json
          test -s build/site/provenance/publication_manifest.json
          grep -q 'href="results.html">Results</a>' build/site/methodology.html
          grep -q 'href="results.html">Results</a>' build/site/sources.html
          ! grep -q 'Loading latest approved synthesis register' build/site/results.html
          ! grep -q '<td colspan="6">Loading…</td>' build/site/sources.html
          grep -q 'name="vaping26-build" content="${{ github.sha }}"' build/site/index.html
          grep -q 'id="external-review-status"' build/site/index.html
          public_short="$(printf '%s' '${{ github.sha }}' | cut -c1-12)"
          grep -q "id=\"public-build-code\">${public_short}" build/site/index.html
          grep -q 'Research code revision' build/site/index.html
          grep -q 'Public build revision' build/site/index.html
          grep -Eq 'id="metric-sources">[^—<]+' build/site/index.html
          grep -Eq 'id="metric-literature">[^—<]+' build/site/index.html
          grep -Eq 'id="metric-cards">[^—<]+' build/site/index.html
          grep -Eq 'id="metric-trials">[^—<]+' build/site/index.html
          grep -Eq 'id="metric-questions">[^—<]+' build/site/index.html
          grep -Eq 'id="design-table">[[:space:]]*<tr>' build/site/index.html
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/site

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: validate-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Vaping26 Observatory to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify exact live publication parity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          base = os.environ["PAGE_URL"].rstrip("/") + "/"
          sha = os.environ["EXPECTED_SHA"]
          failures = []

          def fetch_bytes(rel):
              url = base + rel + ("&" if "?" in rel else "?") + urllib.parse.urlencode({"v": sha})
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Vaping26-live-parity-check/3.0",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}")
                  return response.read()

          html_checks = {
              "index.html": [
                  f'name="vaping26-build" content="{sha}"',
                  "Evidence landscape",
                  'href="results.html">Results</a>',
                  'id="external-review-status"',
                  'Research code revision',
                  'Public build revision',
                  f'id="public-build-code">{sha[:12]}',
                  'id="metric-sources"',
                  'id="metric-literature"',
                  'id="metric-cards"',
                  'id="metric-trials"',
                  'id="metric-questions"',
                  'id="design-table"',
              ],
              "methodology.html": [
                  f'name="vaping26-build" content="{sha}"',
                  'href="results.html">Results</a>',
              ],
              "sources.html": [
                  f'name="vaping26-build" content="{sha}"',
                  'href="results.html">Results</a>',
                  'id="source-count"',
              ],
              "results.html": [
                  f'name="vaping26-build" content="{sha}"',
                  'href="results.html"',
                  'aria-current="page"',
                  'id="r-literature"',
              ],
          }
          forbidden = {
              "index.html": [
                  'id="metric-sources">—',
                  'id="metric-literature">—',
                  'id="metric-cards">—',
                  'id="metric-trials">—',
                  'id="metric-questions">—',
                  'id="design-table"></tbody>',
              ],
              "sources.html": ["<td colspan=\"6\">Loading…</td>"],
              "results.html": ["Loading latest approved synthesis register"],
          }

          for rel, required in html_checks.items():
              last_error = None
              for attempt in range(12):
                  try:
                      text = fetch_bytes(rel).decode("utf-8")
                      missing = [needle for needle in required if needle not in text]
                      present_forbidden = [needle for needle in forbidden.get(rel, []) if needle in text]
                      if missing or present_forbidden:
                          raise RuntimeError(f"missing={missing}; forbidden={present_forbidden}")
                      print(f"PASS HTML {rel}")
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt < 11:
                          time.sleep(5)
              else:
                  failures.append(f"{rel}: {last_error}")

          json_checks = {
              "data/public/research_status.json": lambda p: bool(p.get("generated_at")),
              "evidence/evidence_cards.json": lambda p: int(p.get("card_count", 0)) > 0 and bool(p.get("records")),
              "evidence/health_evidence_summary.json": lambda p: bool(p.get("literature")),
              "evidence/synthesis_register.json": lambda p: int(p.get("question_count", 0)) > 0 and bool(p.get("questions")),
              "provenance/source_register.json": lambda p: int(p.get("source_count", 0)) > 0,
          }
          for rel, predicate in json_checks.items():
              try:
                  payload = json.loads(fetch_bytes(rel))
                  if not predicate(payload):
                      raise RuntimeError("semantic content check failed")
                  print(f"PASS JSON {rel}")
              except Exception as exc:
                  failures.append(f"{rel}: {exc}")

          try:
              pdf = fetch_bytes("downloads/vaping26-current-results.pdf")
              if not pdf.startswith(b"%PDF-") or len(pdf) < 2000:
                  raise RuntimeError("invalid or implausibly small PDF")
              print("PASS PDF downloads/vaping26-current-results.pdf")
          except Exception as exc:
              failures.append(f"downloads/vaping26-current-results.pdf: {exc}")

          if failures:
              raise SystemExit("LIVE PUBLICATION PARITY FAILED\n - " + "\n - ".join(failures))
          print(f"LIVE PUBLICATION PARITY PASS FOR {sha}")
          PY