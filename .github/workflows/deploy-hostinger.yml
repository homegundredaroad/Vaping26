name: Deploy public site to Hostinger

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaping26-hostinger-deployment
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST || secrets.SCCWEBDESIGNTEST_SSH_HOST || vars.SCCWEBDESIGNTEST_SSH_HOST }}
  DEPLOY_USERNAME: ${{ secrets.HOSTINGER_USERNAME || secrets.SCCWEBDESIGNTEST_SSH_USERNAME }}
  DEPLOY_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD || secrets.SCCWEBDESIGNTEST_SSH_PASSWORD }}
  DEPLOY_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
  DEPLOY_PORT: ${{ vars.HOSTINGER_PORT || secrets.SCCWEBDESIGNTEST_SSH_PORT || '65002' }}
  DEPLOY_TARGET_DIR: ${{ vars.HOSTINGER_TARGET_DIR || vars.SCCWEBDESIGNTEST_PUBLIC_HTML_DIR || secrets.SCCWEBDESIGNTEST_PUBLIC_HTML_DIR }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate public repository
        run: python scripts/validate_public.py

      - name: Check deployment configuration and target safety
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USERNAME DEPLOY_PORT DEPLOY_TARGET_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "Missing $name"
              missing=1
            fi
          done
          if [ -z "${DEPLOY_PRIVATE_KEY:-}" ] && [ -z "${DEPLOY_PASSWORD:-}" ]; then
            echo "Missing deployment authentication: configure a private key or SSH password."
            missing=1
          fi
          test "$missing" -eq 0

          case "${DEPLOY_TARGET_DIR,,}" in
            *vaping26*) ;;
            *)
              echo "DEPLOYMENT BLOCKED: target directory must contain 'vaping26' so this workflow cannot accidentally deploy into a shared public_html root."
              echo "Configured target: $DEPLOY_TARGET_DIR"
              exit 1
              ;;
          esac

      - name: Configure SSH host and authentication
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if [ -n "${DEPLOY_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            if ! command -v sshpass >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq sshpass
            fi
          fi

      - name: Deploy site directory
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html

          if [ -n "${DEPLOY_PRIVATE_KEY:-}" ]; then
            ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" \
              "$DEPLOY_USERNAME@$DEPLOY_HOST" "mkdir -p '$DEPLOY_TARGET_DIR'"
            scp -i ~/.ssh/id_ed25519 -P "$DEPLOY_PORT" -r site/. \
              "$DEPLOY_USERNAME@$DEPLOY_HOST:$DEPLOY_TARGET_DIR/"
          else
            export SSHPASS="$DEPLOY_PASSWORD"
            sshpass -e ssh -p "$DEPLOY_PORT" \
              "$DEPLOY_USERNAME@$DEPLOY_HOST" "mkdir -p '$DEPLOY_TARGET_DIR'"
            sshpass -e scp -P "$DEPLOY_PORT" -r site/. \
              "$DEPLOY_USERNAME@$DEPLOY_HOST:$DEPLOY_TARGET_DIR/"
          fi
